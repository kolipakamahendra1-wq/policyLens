name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: policylens
          POSTGRES_PASSWORD: policylens
          POSTGRES_DB: policylens
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U policylens"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      USE_LLM: "0"
      USE_OLLAMA_EMBED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests
        run: pytest -q
      - name: Offline evaluation (50 synthetic cases, rule-based fallback)
        run: |
          python -m evaluation.run_eval | tee eval.txt
          python - <<'EOF'
          import json
          m = json.load(open("evaluation/reports/eval-offline.json"))["metrics"]
          assert m["false_compliance_rate"] == 0, f"false compliance: {m['false_compliance_rate']}"
          assert m["policy_retrieval_recall"] >= 0.85, m
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: evaluation/reports/

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose -f infrastructure/docker-compose.yml build
