# Rendered by the nginx image's envsubst at startup (see Dockerfile.frontend for defaults).
server {
    listen ${LISTEN};
    root /usr/share/nginx/html;
    client_max_body_size 12m;

    # Re-resolve the backend on each request so a recreated container is found.
    resolver ${RESOLVER} valid=10s;
    set $backend ${BACKEND_URL};

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;   # evaluation with an LLM can take minutes
    }

    location / {
        try_files $uri /index.html;
    }
}
